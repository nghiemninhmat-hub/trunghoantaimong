<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="drgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6d1b"/>
      <stop offset="25%" stop-color="#e8c84a"/>
      <stop offset="50%" stop-color="#fff3a0"/>
      <stop offset="75%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#8a6d1b"/>
    </linearGradient>
    <radialGradient id="drgInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#e8c84a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a6d1b" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#drgInnerGlow)"/>
  <!-- Main ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#drgGold)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#drgGold)" stroke-width="5" opacity="0.85"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#8a6d1b" stroke-width="0.8" opacity="0.4"/>
  <!-- Dragon coiling left side — from top to bottom -->
  <g opacity="0.9">
    <!-- Serpentine body -->
    <path d="M120,20 C95,25 75,40 68,65 C65,75 70,82 78,80 C85,78 88,72 84,66 C80,60 84,54 92,55 C100,56 104,64 100,72 C96,80 88,85 80,82" fill="none" stroke="url(#drgGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Dragon head at top-left -->
    <g transform="translate(82,38)">
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="url(#drgGold)" stroke="#8a6d1b" stroke-width="0.4"/>
      <circle cx="-3" cy="-1" r="1.5" fill="#c8392b"/>
      <circle cx="-3" cy="-1" r="0.5" fill="#fff" opacity="0.8"/>
      <!-- Snout -->
      <path d="M-6,2 L-10,4 L-7,1" fill="url(#drgGold)"/>
      <!-- Teeth -->
      <path d="M-7,3 L-8,5 L-6,3" fill="#fff" opacity="0.7"/>
      <!-- Horns -->
      <path d="M3,-4 L6,-10 L4,-3" fill="url(#drgGold)" stroke="#8a6d1b" stroke-width="0.3"/>
      <path d="M-1,-4 L-3,-10 L0,-3" fill="url(#drgGold)" stroke="#8a6d1b" stroke-width="0.3"/>
      <!-- Whisker -->
      <path d="M-8,3 Q-14,4 -16,2" fill="none" stroke="url(#drgGold)" stroke-width="0.8" opacity="0.6"/>
    </g>
    <!-- Scales detail -->
    <g fill="none" stroke="#8a6d1b" stroke-width="0.4" opacity="0.35">
      <path d="M78,46 Q80,44 82,46"/>
      <path d="M74,52 Q76,50 78,52"/>
      <path d="M70,58 Q72,56 74,58"/>
      <path d="M68,66 Q70,64 72,66"/>
      <path d="M70,74 Q72,72 74,74"/>
    </g>
  </g>
  <!-- Dragon coiling right side — mirror -->
  <g opacity="0.9">
    <path d="M120,20 C145,25 165,40 172,65 C175,75 170,82 162,80 C155,78 152,72 156,66 C160,60 156,54 148,55 C140,56 136,64 140,72 C144,80 152,85 160,82" fill="none" stroke="url(#drgGold)" stroke-width="3.5" stroke-linecap="round"/>
    <g transform="translate(158,38)">
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="url(#drgGold)" stroke="#8a6d1b" stroke-width="0.4"/>
      <circle cx="3" cy="-1" r="1.5" fill="#c8392b"/>
      <circle cx="3" cy="-1" r="0.5" fill="#fff" opacity="0.8"/>
      <path d="M6,2 L10,4 L7,1" fill="url(#drgGold)"/>
      <path d="M7,3 L8,5 L6,3" fill="#fff" opacity="0.7"/>
      <path d="M-3,-4 L-6,-10 L-4,-3" fill="url(#drgGold)" stroke="#8a6d1b" stroke-width="0.3"/>
      <path d="M1,-4 L3,-10 L0,-3" fill="url(#drgGold)" stroke="#8a6d1b" stroke-width="0.3"/>
      <path d="M8,3 Q14,4 16,2" fill="none" stroke="url(#drgGold)" stroke-width="0.8" opacity="0.6"/>
    </g>
    <g fill="none" stroke="#8a6d1b" stroke-width="0.4" opacity="0.35">
      <path d="M162,46 Q160,44 158,46"/>
      <path d="M166,52 Q164,50 162,52"/>
      <path d="M170,58 Q168,56 166,58"/>
      <path d="M172,66 Q170,64 168,66"/>
      <path d="M170,74 Q168,72 166,74"/>
    </g>
  </g>
  <!-- Flaming pearl at top center -->
  <g transform="translate(120,18)">
    <circle cx="0" cy="0" r="6" fill="url(#drgGold)"/>
    <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#fff"/>
    <!-- Flames -->
    <path d="M0,-6 C-3,-10 -1,-14 0,-16 C1,-14 3,-10 0,-6" fill="url(#drgGold)" opacity="0.7"/>
    <path d="M-4,-4 C-6,-7 -5,-10 -3,-11" fill="url(#drgGold)" opacity="0.4"/>
    <path d="M4,-4 C6,-7 5,-10 3,-11" fill="url(#drgGold)" opacity="0.4"/>
  </g>
  <!-- Auspicious clouds at bottom -->
  <g transform="translate(120,218)" opacity="0.7">
    <path d="M-22,0 Q-16,-6 -10,-2 Q-5,-7 0,-2 Q5,-7 10,-2 Q16,-6 22,0" fill="none" stroke="url(#drgGold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Gold dots -->
  <g fill="#fff3a0" opacity="0.5">
    <circle cx="40" cy="120" r="2"/>
    <circle cx="200" cy="120" r="2"/>
  </g>
</svg>
