<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="slwJade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="30%" stop-color="#e8f0f8"/>
      <stop offset="50%" stop-color="#f0f8ff"/>
      <stop offset="70%" stop-color="#d8e8f0"/>
      <stop offset="100%" stop-color="#a8c0d8"/>
    </linearGradient>
    <linearGradient id="slwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a030"/>
      <stop offset="50%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#c8a030"/>
    </linearGradient>
    <radialGradient id="slwInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#e8f0f8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a8c0d8" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#slwInnerGlow)"/>
  <!-- White jade ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#slwJade)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#slwJade)" stroke-width="6" opacity="0.9"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#slwGold)" stroke-width="0.8" opacity="0.4"/>
  <!-- Ice texture cracks -->
  <g fill="none" stroke="#c8d8e8" stroke-width="0.4" opacity="0.35">
    <path d="M30,90 L36,85 L33,80"/>
    <path d="M210,90 L204,85 L207,80"/>
    <path d="M30,150 L36,155 L33,160"/>
    <path d="M210,150 L204,155 L207,160"/>
    <path d="M50,50 L55,46"/>
    <path d="M190,50 L185,46"/>
    <path d="M50,190 L55,194"/>
    <path d="M190,190 L185,194"/>
  </g>
  <!-- Snow lotus at top — delicate -->
  <g transform="translate(120,22)">
    <!-- Outer petals — 6 petals -->
    <ellipse cx="0" cy="-7" rx="5" ry="10" fill="url(#slwJade)" stroke="#c8d8e8" stroke-width="0.3" opacity="0.85"/>
    <ellipse cx="-5" cy="-4" rx="4.5" ry="9" fill="url(#slwJade)" stroke="#c8d8e8" stroke-width="0.3" opacity="0.75" transform="rotate(-35)"/>
    <ellipse cx="5" cy="-4" rx="4.5" ry="9" fill="url(#slwJade)" stroke="#c8d8e8" stroke-width="0.3" opacity="0.75" transform="rotate(35)"/>
    <ellipse cx="-7" cy="0" rx="4" ry="7" fill="url(#slwJade)" opacity="0.6" transform="rotate(-65)"/>
    <ellipse cx="7" cy="0" rx="4" ry="7" fill="url(#slwJade)" opacity="0.6" transform="rotate(65)"/>
    <!-- Inner petals -->
    <ellipse cx="0" cy="-4" rx="3" ry="6" fill="#f0f8ff" opacity="0.9"/>
    <ellipse cx="-2" cy="-1" rx="2" ry="4" fill="#fff" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="2" cy="-1" rx="2" ry="4" fill="#fff" opacity="0.7" transform="rotate(20)"/>
    <!-- Center -->
    <circle cx="0" cy="-2" r="2.5" fill="url(#slwGold)"/>
    <circle cx="0" cy="-2" r="1" fill="#fff3a0" opacity="0.7"/>
  </g>
  <!-- Gold butterfly at bottom-left -->
  <g transform="translate(38,195)">
    <!-- Upper wings -->
    <ellipse cx="-5" cy="-3" rx="5" ry="4" fill="url(#slwGold)" opacity="0.75" stroke="#c8a030" stroke-width="0.3"/>
    <ellipse cx="5" cy="-3" rx="5" ry="4" fill="url(#slwGold)" opacity="0.75" stroke="#c8a030" stroke-width="0.3"/>
    <!-- Lower wings -->
    <ellipse cx="-4" cy="3" rx="4" ry="3" fill="url(#slwGold)" opacity="0.55"/>
    <ellipse cx="4" cy="3" rx="4" ry="3" fill="url(#slwGold)" opacity="0.55"/>
    <!-- Wing patterns -->
    <circle cx="-5" cy="-3" r="1.5" fill="#fff3a0" opacity="0.5"/>
    <circle cx="5" cy="-3" r="1.5" fill="#fff3a0" opacity="0.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="1" ry="5" fill="#c8a030"/>
    <!-- Antennae -->
    <path d="M0,-5 L-2,-8" fill="none" stroke="#c8a030" stroke-width="0.5"/>
    <path d="M0,-5 L2,-8" fill="none" stroke="#c8a030" stroke-width="0.5"/>
  </g>
  <!-- Gold butterfly at bottom-right -->
  <g transform="translate(202,195) scale(-1,1)">
    <ellipse cx="-5" cy="-3" rx="5" ry="4" fill="url(#slwGold)" opacity="0.75" stroke="#c8a030" stroke-width="0.3"/>
    <ellipse cx="5" cy="-3" rx="5" ry="4" fill="url(#slwGold)" opacity="0.75" stroke="#c8a030" stroke-width="0.3"/>
    <ellipse cx="-4" cy="3" rx="4" ry="3" fill="url(#slwGold)" opacity="0.55"/>
    <ellipse cx="4" cy="3" rx="4" ry="3" fill="url(#slwGold)" opacity="0.55"/>
    <circle cx="-5" cy="-3" r="1.5" fill="#fff3a0" opacity="0.5"/>
    <circle cx="5" cy="-3" r="1.5" fill="#fff3a0" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="1" ry="5" fill="#c8a030"/>
    <path d="M0,-5 L-2,-8" fill="none" stroke="#c8a030" stroke-width="0.5"/>
    <path d="M0,-5 L2,-8" fill="none" stroke="#c8a030" stroke-width="0.5"/>
  </g>
  <!-- Silk ribbon left -->
  <g transform="translate(30,120)" opacity="0.45">
    <path d="M0,-20 C-3,-8 3,4 0,16" fill="none" stroke="url(#slwGold)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Silk ribbon right -->
  <g transform="translate(210,120)" opacity="0.45">
    <path d="M0,-20 C3,-8 -3,4 0,16" fill="none" stroke="url(#slwGold)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Emerald accents -->
  <g fill="#50c878" opacity="0.55" stroke="#3a8a5a" stroke-width="0.3">
    <circle cx="55" cy="55" r="2.5"/>
    <circle cx="185" cy="55" r="2.5"/>
  </g>
  <!-- Pearl accents -->
  <g fill="#f0f0f0" opacity="0.6" stroke="#d0d0d0" stroke-width="0.3">
    <circle cx="55" cy="185" r="2.5"/>
    <circle cx="185" cy="185" r="2.5"/>
  </g>
  <!-- Subtle shimmer dots -->
  <g fill="#fff" opacity="0.4">
    <circle cx="80" cy="80" r="0.8"/>
    <circle cx="160" cy="80" r="0.8"/>
    <circle cx="80" cy="160" r="0.8"/>
    <circle cx="160" cy="160" r="0.8"/>
  </g>
</svg>
