<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bstBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="30%" stop-color="#3a5a3a"/>
      <stop offset="50%" stop-color="#4a7a4a"/>
      <stop offset="70%" stop-color="#3a5a3a"/>
      <stop offset="100%" stop-color="#0a1a0a"/>
    </linearGradient>
    <linearGradient id="bstObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
    <radialGradient id="bstInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#3a5a3a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a2a1a" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#bstInnerGlow)"/>
  <!-- Bronze ring with green patina -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#bstBronze)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#bstBronze)" stroke-width="6" opacity="0.85"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#2a3a2a" stroke-width="0.8" opacity="0.4"/>
  <!-- Qilin (mythical beast) at top — detailed relief -->
  <g transform="translate(120,22)">
    <!-- Body -->
    <path d="M-10,6 C-14,2 -12,-4 -6,-6 C-3,-7 0,-8 3,-7 C9,-6 12,-2 10,4 C9,6 7,7 5,6" fill="url(#bstBronze)" stroke="#1a2a1a" stroke-width="0.3"/>
    <!-- Head -->
    <ellipse cx="-6" cy="-4" rx="4" ry="3" fill="url(#bstBronze)" stroke="#1a2a1a" stroke-width="0.3"/>
    <!-- Single horn -->
    <path d="M-7,-7 L-9,-13 L-6,-7" fill="url(#bstBronze)" stroke="#1a2a1a" stroke-width="0.3"/>
    <path d="M-8,-10 L-9,-13" fill="none" stroke="#4a7a4a" stroke-width="0.4" opacity="0.6"/>
    <!-- Eye -->
    <circle cx="-6" cy="-4" r="1" fill="url(#bstObsidian)"/>
    <circle cx="-6" cy="-4" r="0.4" fill="#3a5a3a" opacity="0.8"/>
    <!-- Snout -->
    <path d="M-9,-3 L-12,-2 L-10,-1" fill="url(#bstBronze)"/>
    <!-- Legs -->
    <path d="M-5,6 L-6,11" fill="none" stroke="#1a2a1a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M3,6 L4,11" fill="none" stroke="#1a2a1a" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Tail — flowing -->
    <path d="M10,4 C16,2 20,-2 18,-6" fill="none" stroke="url(#bstBronze)" stroke-width="2" stroke-linecap="round"/>
    <path d="M10,4 C14,0 17,-4 15,-8" fill="none" stroke="#4a7a4a" stroke-width="0.8" opacity="0.4"/>
    <!-- Body scale texture -->
    <g fill="none" stroke="#1a2a1a" stroke-width="0.3" opacity="0.3">
      <path d="M-2,-2 Q0,-4 2,-2"/>
      <path d="M2,0 Q4,-2 6,0"/>
      <path d="M-4,2 Q-2,0 0,2"/>
    </g>
  </g>
  <!-- Pixiu at bottom — mirror -->
  <g transform="translate(120,218) rotate(180)">
    <path d="M-10,6 C-14,2 -12,-4 -6,-6 C-3,-7 0,-8 3,-7 C9,-6 12,-2 10,4 C9,6 7,7 5,6" fill="url(#bstBronze)" stroke="#1a2a1a" stroke-width="0.3"/>
    <ellipse cx="6" cy="-4" rx="4" ry="3" fill="url(#bstBronze)" stroke="#1a2a1a" stroke-width="0.3"/>
    <path d="M7,-7 L9,-13 L6,-7" fill="url(#bstBronze)" stroke="#1a2a1a" stroke-width="0.3"/>
    <path d="M8,-10 L9,-13" fill="none" stroke="#4a7a4a" stroke-width="0.4" opacity="0.6"/>
    <circle cx="6" cy="-4" r="1" fill="url(#bstObsidian)"/>
    <circle cx="6" cy="-4" r="0.4" fill="#3a5a3a" opacity="0.8"/>
    <path d="M9,-3 L12,-2 L10,-1" fill="url(#bstBronze)"/>
    <path d="M-5,6 L-6,11" fill="none" stroke="#1a2a1a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M3,6 L4,11" fill="none" stroke="#1a2a1a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-10,4 C-16,2 -20,-2 -18,-6" fill="none" stroke="url(#bstBronze)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Obsidian stones at sides -->
  <g fill="url(#bstObsidian)" stroke="#0a0a1e" stroke-width="0.4">
    <circle cx="28" cy="120" r="4"/>
    <circle cx="212" cy="120" r="4"/>
  </g>
  <!-- Obsidian inner highlight -->
  <g fill="#3a3a5e" opacity="0.4">
    <circle cx="27" cy="119" r="2"/>
    <circle cx="211" cy="119" r="2"/>
  </g>
  <!-- Turquoise stones at corners -->
  <g fill="#1a8a8a" stroke="#0a5a5a" stroke-width="0.3" opacity="0.75">
    <circle cx="55" cy="55" r="3"/>
    <circle cx="185" cy="55" r="3"/>
    <circle cx="55" cy="185" r="3"/>
    <circle cx="185" cy="185" r="3"/>
  </g>
  <!-- Ancient runic symbols -->
  <g fill="none" stroke="#3a5a3a" stroke-width="0.6" opacity="0.45">
    <path d="M42,85 L46,81 L42,77 L38,81 Z"/>
    <path d="M198,85 L202,81 L198,77 L194,81 Z"/>
    <path d="M42,155 L46,159 L42,163 L38,159 Z"/>
    <path d="M198,155 L202,159 L198,163 L194,159 Z"/>
  </g>
  <!-- Patina spots — green oxidation -->
  <g fill="#3a5a3a" opacity="0.3">
    <circle cx="38" cy="70" r="2"/>
    <circle cx="202" cy="70" r="2"/>
    <circle cx="38" cy="170" r="2"/>
    <circle cx="202" cy="170" r="2"/>
    <circle cx="120" cy="38" r="1.5"/>
    <circle cx="120" cy="202" r="1.5"/>
  </g>
  <!-- Mystical border lines -->
  <g fill="none" stroke="#2a3a2a" stroke-width="0.4" opacity="0.35">
    <path d="M28,120 Q32,115 28,108"/>
    <path d="M212,120 Q208,115 212,108"/>
    <path d="M28,120 Q32,125 28,132"/>
    <path d="M212,120 Q208,125 212,132"/>
  </g>
  <!-- Dark mystical aura dots -->
  <g fill="#1a1a2e" opacity="0.4">
    <circle cx="70" cy="80" r="1"/>
    <circle cx="170" cy="80" r="1"/>
    <circle cx="70" cy="160" r="1"/>
    <circle cx="170" cy="160" r="1"/>
  </g>
</svg>
