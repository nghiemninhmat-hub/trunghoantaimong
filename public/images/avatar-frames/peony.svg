<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="pnyJade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a5c40"/>
      <stop offset="35%" stop-color="#1a8a63"/>
      <stop offset="55%" stop-color="#2ba878"/>
      <stop offset="75%" stop-color="#1a8a63"/>
      <stop offset="100%" stop-color="#0a5c40"/>
    </linearGradient>
    <linearGradient id="pnyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#f4d03f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="pnyInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#1a8a63" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a5c40" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#pnyInnerGlow)"/>
  <!-- Jade ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#pnyJade)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#pnyJade)" stroke-width="6" opacity="0.9"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#pnyGold)" stroke-width="0.8" opacity="0.5"/>
  <!-- Peony at top — layered petals -->
  <g transform="translate(120,22)">
    <!-- Outer petals -->
    <ellipse cx="0" cy="-6" rx="6" ry="10" fill="url(#pnyGold)" opacity="0.75" stroke="#b8860b" stroke-width="0.3"/>
    <ellipse cx="-6" cy="-3" rx="5" ry="9" fill="url(#pnyGold)" opacity="0.65" transform="rotate(-30 -6 -3)" stroke="#b8860b" stroke-width="0.3"/>
    <ellipse cx="6" cy="-3" rx="5" ry="9" fill="url(#pnyGold)" opacity="0.65" transform="rotate(30 6 -3)" stroke="#b8860b" stroke-width="0.3"/>
    <ellipse cx="-4" cy="2" rx="4" ry="7" fill="url(#pnyGold)" opacity="0.55" transform="rotate(-55 -4 2)"/>
    <ellipse cx="4" cy="2" rx="4" ry="7" fill="url(#pnyGold)" opacity="0.55" transform="rotate(55 4 2)"/>
    <!-- Inner petals -->
    <ellipse cx="0" cy="-3" rx="3.5" ry="6" fill="#f4d03f" opacity="0.85"/>
    <ellipse cx="-2" cy="0" rx="2.5" ry="4" fill="#fff3a0" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="2" cy="0" rx="2.5" ry="4" fill="#fff3a0" opacity="0.7" transform="rotate(20)"/>
    <!-- Center -->
    <circle cx="0" cy="-1" r="2" fill="#b8860b"/>
    <circle cx="0" cy="-1" r="1" fill="#fff3a0" opacity="0.6"/>
  </g>
  <!-- Peony at bottom — mirror -->
  <g transform="translate(120,218) rotate(180)">
    <ellipse cx="0" cy="-6" rx="6" ry="10" fill="url(#pnyGold)" opacity="0.75" stroke="#b8860b" stroke-width="0.3"/>
    <ellipse cx="-6" cy="-3" rx="5" ry="9" fill="url(#pnyGold)" opacity="0.65" transform="rotate(-30 -6 -3)" stroke="#b8860b" stroke-width="0.3"/>
    <ellipse cx="6" cy="-3" rx="5" ry="9" fill="url(#pnyGold)" opacity="0.65" transform="rotate(30 6 -3)" stroke="#b8860b" stroke-width="0.3"/>
    <ellipse cx="-4" cy="2" rx="4" ry="7" fill="url(#pnyGold)" opacity="0.55" transform="rotate(-55 -4 2)"/>
    <ellipse cx="4" cy="2" rx="4" ry="7" fill="url(#pnyGold)" opacity="0.55" transform="rotate(55 4 2)"/>
    <ellipse cx="0" cy="-3" rx="3.5" ry="6" fill="#f4d03f" opacity="0.85"/>
    <circle cx="0" cy="-1" r="2" fill="#b8860b"/>
    <circle cx="0" cy="-1" r="1" fill="#fff3a0" opacity="0.6"/>
  </g>
  <!-- Silk ribbon flowing left -->
  <g transform="translate(30,120)" opacity="0.55">
    <path d="M0,-25 C-4,-12 4,0 0,12 C-4,20 4,28 0,35" fill="none" stroke="url(#pnyGold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M2,-22 C-2,-10 6,2 2,14" fill="none" stroke="url(#pnyJade)" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Silk ribbon flowing right -->
  <g transform="translate(210,120)" opacity="0.55">
    <path d="M0,-25 C4,-12 -4,0 0,12 C4,20 -4,28 0,35" fill="none" stroke="url(#pnyGold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-2,-22 C2,-10 -6,2 -2,14" fill="none" stroke="url(#pnyJade)" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Emerald beads at corners -->
  <g fill="#2ba878" opacity="0.7" stroke="#0a5c40" stroke-width="0.3">
    <circle cx="55" cy="55" r="3"/>
    <circle cx="185" cy="55" r="3"/>
    <circle cx="55" cy="185" r="3"/>
    <circle cx="185" cy="185" r="3"/>
  </g>
  <!-- Jade texture lines -->
  <g fill="none" stroke="#0a5c40" stroke-width="0.4" opacity="0.25">
    <path d="M28,120 Q32,115 28,108"/>
    <path d="M212,120 Q208,115 212,108"/>
    <path d="M28,132 Q32,137 28,144"/>
    <path d="M212,132 Q208,137 212,144"/>
  </g>
</svg>
