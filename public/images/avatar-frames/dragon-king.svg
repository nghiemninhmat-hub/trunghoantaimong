<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c00"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff5b4"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#a67c00"/>
    </linearGradient>
    <filter id="dkGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer thick gold ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#dkGold)" stroke-width="18"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#a67c00" stroke-width="1.5" opacity="0.6"/>
  <!-- Dragon coiling full ring - left arc -->
  <g filter="url(#dkGlow)">
    <path d="M100,6 C70,10 45,30 35,60 C30,75 35,85 45,88 C55,91 62,85 58,75 C54,65 60,55 70,55 C80,55 85,65 80,75 C75,85 65,90 55,88" fill="none" stroke="url(#dkGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Dragon head top-left -->
    <g transform="translate(68,28)">
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="url(#dkGold)" stroke="#a67c00" stroke-width="0.5"/>
      <circle cx="-2.5" cy="-1" r="1.2" fill="#c0392b"/>
      <path d="M-5,2 L-9,4 L-6,2" fill="url(#dkGold)"/>
      <path d="M2,-4 L5,-8 L3,-3" fill="url(#dkGold)" stroke="#a67c00" stroke-width="0.3"/>
      <path d="M-2,-4 L-5,-8 L-3,-3" fill="url(#dkGold)" stroke="#a67c00" stroke-width="0.3"/>
    </g>
    <!-- Scales -->
    <g fill="none" stroke="#a67c00" stroke-width="0.5" opacity="0.4">
      <path d="M65,36 Q67,34 69,36"/>
      <path d="M62,42 Q64,40 66,42"/>
      <path d="M58,48 Q60,46 62,48"/>
      <path d="M52,56 Q54,54 56,56"/>
      <path d="M46,64 Q48,62 50,64"/>
    </g>
  </g>
  <!-- Dragon coiling right arc -->
  <g filter="url(#dkGlow)">
    <path d="M100,6 C130,10 155,30 165,60 C170,75 165,85 155,88 C145,91 138,85 142,75 C146,65 140,55 130,55 C120,55 115,65 120,75 C125,85 135,90 145,88" fill="none" stroke="url(#dkGold)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Dragon head top-right -->
    <g transform="translate(132,28)">
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="url(#dkGold)" stroke="#a67c00" stroke-width="0.5"/>
      <circle cx="2.5" cy="-1" r="1.2" fill="#c0392b"/>
      <path d="M5,2 L9,4 L6,2" fill="url(#dkGold)"/>
      <path d="M-2,-4 L-5,-8 L-3,-3" fill="url(#dkGold)" stroke="#a67c00" stroke-width="0.3"/>
      <path d="M2,-4 L5,-8 L3,-3" fill="url(#dkGold)" stroke="#a67c00" stroke-width="0.3"/>
    </g>
    <!-- Scales -->
    <g fill="none" stroke="#a67c00" stroke-width="0.5" opacity="0.4">
      <path d="M135,36 Q133,34 131,36"/>
      <path d="M138,42 Q136,40 134,42"/>
      <path d="M142,48 Q140,46 138,48"/>
      <path d="M148,56 Q146,54 144,56"/>
      <path d="M154,64 Q152,62 150,64"/>
    </g>
  </g>
  <!-- Flaming pearl at top center -->
  <g transform="translate(100,12)" filter="url(#dkGlow)">
    <circle cx="0" cy="0" r="5" fill="url(#dkGold)"/>
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.7"/>
    <circle cx="0" cy="0" r="1.5" fill="#fff"/>
    <!-- Flames -->
    <path d="M0,-5 C-3,-8 -1,-11 0,-13 C1,-11 3,-8 0,-5" fill="url(#dkGold)" opacity="0.8"/>
    <path d="M-4,-3 C-6,-5 -5,-7 -3,-8" fill="url(#dkGold)" opacity="0.5"/>
    <path d="M4,-3 C6,-5 5,-7 3,-8" fill="url(#dkGold)" opacity="0.5"/>
  </g>
  <!-- Cloud patterns bottom -->
  <g transform="translate(100,188)" opacity="0.7">
    <path d="M-18,0 Q-12,-5 -6,0 Q0,-5 6,0 Q12,-5 18,0" fill="none" stroke="url(#dkGold)" stroke-width="2.5"/>
  </g>
  <!-- Ruby accents -->
  <g fill="#c0392b" stroke="#a67c00" stroke-width="0.3">
    <circle cx="40" cy="100" r="2.5"/>
    <circle cx="160" cy="100" r="2.5"/>
  </g>
  <!-- Gold sparkles -->
  <g fill="#fff5b4" opacity="0.6">
    <circle cx="55" cy="55" r="1"/>
    <circle cx="145" cy="55" r="1"/>
    <circle cx="55" cy="145" r="1"/>
    <circle cx="145" cy="145" r="1"/>
  </g>
</svg>
