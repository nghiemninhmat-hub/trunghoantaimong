<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="pckSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="25%" stop-color="#a8a8a8"/>
      <stop offset="50%" stop-color="#e0e0e0"/>
      <stop offset="75%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#505050"/>
    </linearGradient>
    <radialGradient id="pckEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a6abf"/>
      <stop offset="35%" stop-color="#2a8adf"/>
      <stop offset="60%" stop-color="#1a4a8a"/>
      <stop offset="85%" stop-color="#0a2a5a"/>
      <stop offset="100%" stop-color="#061838"/>
    </radialGradient>
    <radialGradient id="pckInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#a8a8a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#606060" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#pckInnerGlow)"/>
  <!-- Silver ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#pckSilver)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#pckSilver)" stroke-width="6" opacity="0.85"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#pckSilver)" stroke-width="0.8" opacity="0.4"/>
  <!-- Peacock feather eye at top — prominent -->
  <g transform="translate(120,22)">
    <!-- Outer feather shape -->
    <ellipse cx="0" cy="-3" rx="10" ry="15" fill="url(#pckSilver)" opacity="0.25" stroke="#808080" stroke-width="0.3"/>
    <!-- Feather fronds around eye -->
    <g stroke="#808080" stroke-width="0.5" opacity="0.5" fill="none">
      <path d="M-9,-2 Q-12,-6 -10,-10"/>
      <path d="M-7,1 Q-10,-3 -8,-7"/>
      <path d="M9,-2 Q12,-6 10,-10"/>
      <path d="M7,1 Q10,-3 8,-7"/>
      <path d="M0,4 Q-2,8 -4,10"/>
      <path d="M0,4 Q2,8 4,10"/>
    </g>
    <!-- Eye of feather — iridescent -->
    <ellipse cx="0" cy="-5" rx="6" ry="8" fill="url(#pckEye)" stroke="#1a4a8a" stroke-width="0.5"/>
    <ellipse cx="0" cy="-5" rx="4" ry="5.5" fill="#0a2a5a" opacity="0.7"/>
    <ellipse cx="0" cy="-5" rx="2.5" ry="3.5" fill="#1a6abf" opacity="0.8"/>
    <ellipse cx="0" cy="-5" rx="1.2" ry="2" fill="#2a8adf"/>
    <ellipse cx="0" cy="-5" rx="0.5" ry="1" fill="#fff" opacity="0.6"/>
  </g>
  <!-- Peacock feather patterns along left arc -->
  <g transform="translate(30,120) rotate(-90)" opacity="0.65">
    <!-- Feather 1 — top -->
    <ellipse cx="0" cy="-20" rx="5" ry="10" fill="url(#pckSilver)" opacity="0.2"/>
    <ellipse cx="0" cy="-21" rx="3" ry="5" fill="url(#pckEye)" opacity="0.6"/>
    <ellipse cx="0" cy="-21" rx="1.5" ry="2.5" fill="#1a6abf" opacity="0.7"/>
    <!-- Feather 2 — middle -->
    <ellipse cx="-5" cy="-5" rx="4" ry="8" fill="url(#pckSilver)" opacity="0.2"/>
    <ellipse cx="-5" cy="-6" rx="2.5" ry="4" fill="url(#pckEye)" opacity="0.45"/>
    <!-- Feather 3 — bottom -->
    <ellipse cx="5" cy="8" rx="4" ry="8" fill="url(#pckSilver)" opacity="0.2"/>
    <ellipse cx="5" cy="7" rx="2.5" ry="4" fill="url(#pckEye)" opacity="0.45"/>
  </g>
  <!-- Peacock feather patterns along right arc -->
  <g transform="translate(210,120) rotate(90)" opacity="0.65">
    <ellipse cx="0" cy="-20" rx="5" ry="10" fill="url(#pckSilver)" opacity="0.2"/>
    <ellipse cx="0" cy="-21" rx="3" ry="5" fill="url(#pckEye)" opacity="0.6"/>
    <ellipse cx="0" cy="-21" rx="1.5" ry="2.5" fill="#1a6abf" opacity="0.7"/>
    <ellipse cx="-5" cy="-5" rx="4" ry="8" fill="url(#pckSilver)" opacity="0.2"/>
    <ellipse cx="-5" cy="-6" rx="2.5" ry="4" fill="url(#pckEye)" opacity="0.45"/>
    <ellipse cx="5" cy="8" rx="4" ry="8" fill="url(#pckSilver)" opacity="0.2"/>
    <ellipse cx="5" cy="7" rx="2.5" ry="4" fill="url(#pckEye)" opacity="0.45"/>
  </g>
  <!-- Gemstones at bottom — sapphire, amethyst, topaz -->
  <g transform="translate(120,218)">
    <!-- Sapphire -->
    <ellipse cx="-10" cy="0" rx="4" ry="3.5" fill="#2a6abf" stroke="#1a4a8a" stroke-width="0.3"/>
    <ellipse cx="-10" cy="-1" rx="2" ry="1.5" fill="#4a8adf" opacity="0.5"/>
    <!-- Amethyst -->
    <ellipse cx="0" cy="0" rx="4" ry="3.5" fill="#8a4abf" stroke="#5a2a8a" stroke-width="0.3"/>
    <ellipse cx="0" cy="-1" rx="2" ry="1.5" fill="#aa6adf" opacity="0.5"/>
    <!-- Topaz -->
    <ellipse cx="10" cy="0" rx="4" ry="3.5" fill="#e8a830" stroke="#b87820" stroke-width="0.3"/>
    <ellipse cx="10" cy="-1" rx="2" ry="1.5" fill="#f8c850" opacity="0.5"/>
  </g>
  <!-- Cloisonne enamel effect lines -->
  <g fill="none" stroke="#808080" stroke-width="0.4" opacity="0.35">
    <path d="M45,65 Q50,60 55,65 Q60,70 65,65"/>
    <path d="M175,65 Q180,60 185,65 Q190,70 195,65"/>
    <path d="M45,175 Q50,180 55,175 Q60,170 65,175"/>
    <path d="M175,175 Q180,180 185,175 Q190,170 195,175"/>
  </g>
  <!-- Silver sparkles -->
  <g fill="#e0e0e0" opacity="0.5">
    <circle cx="55" cy="55" r="1.5"/>
    <circle cx="185" cy="55" r="1.5"/>
    <circle cx="55" cy="185" r="1.5"/>
    <circle cx="185" cy="185" r="1.5"/>
  </g>
  <!-- Colorful accent dots from feather pattern -->
  <g opacity="0.4">
    <circle cx="60" cy="100" r="1.5" fill="#2a8adf"/>
    <circle cx="180" cy="100" r="1.5" fill="#2a8adf"/>
    <circle cx="60" cy="140" r="1.5" fill="#8a4abf"/>
    <circle cx="180" cy="140" r="1.5" fill="#8a4abf"/>
  </g>
</svg>
