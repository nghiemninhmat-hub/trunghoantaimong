<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="phoenixGold" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="82%" stop-color="#d4a017"/>
      <stop offset="88%" stop-color="#f4d03f"/>
      <stop offset="95%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
    <linearGradient id="phoenixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="50%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#922b21"/>
    </linearGradient>
    <filter id="phoenixGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#phoenixGold)" stroke-width="14"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#d4a017" stroke-width="1.5" opacity="0.6"/>
  <!-- Phoenix at top -->
  <g transform="translate(100,18)" filter="url(#phoenixGlow)">
    <path d="M0,8 C-12,2 -18,-2 -14,-8 C-10,-4 -6,-6 -4,-10 C-2,-6 0,-8 0,-12 C0,-8 2,-6 4,-10 C6,-6 10,-4 14,-8 C18,-2 12,2 0,8 Z" fill="url(#phoenixRed)" stroke="#d4a017" stroke-width="0.5"/>
    <circle cx="0" cy="-6" r="1.5" fill="#1a1a1a"/>
    <!-- Tail feathers flowing down -->
    <path d="M-6,6 Q-10,14 -8,20" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.8"/>
    <path d="M0,8 Q0,16 0,22" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.8"/>
    <path d="M6,6 Q10,14 8,20" fill="none" stroke="#e74c3c" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- Phoenix tail feathers wrapping left -->
  <g transform="translate(30,100) rotate(-90)" opacity="0.7">
    <path d="M0,0 C-4,-8 -2,-16 2,-20 C4,-16 6,-8 4,0" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M0,0 C-6,-6 -4,-14 0,-18" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  </g>
  <!-- Phoenix tail feathers wrapping right -->
  <g transform="translate(170,100) rotate(90)" opacity="0.7">
    <path d="M0,0 C-4,-8 -2,-16 2,-20 C4,-16 6,-8 4,0" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
    <path d="M0,0 C-6,-6 -4,-14 0,-18" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  </g>
  <!-- Ruby accents at bottom -->
  <g transform="translate(100,182)">
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#e74c3c" stroke="#d4a017" stroke-width="0.5"/>
    <ellipse cx="-8" cy="0" rx="2.5" ry="2" fill="#e74c3c" opacity="0.8"/>
    <ellipse cx="8" cy="0" rx="2.5" ry="2" fill="#e74c3c" opacity="0.8"/>
  </g>
  <!-- Small gold filigree dots -->
  <g fill="#f4d03f" opacity="0.8">
    <circle cx="50" cy="50" r="1.5"/>
    <circle cx="150" cy="50" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/>
    <circle cx="150" cy="150" r="1.5"/>
  </g>
</svg>
