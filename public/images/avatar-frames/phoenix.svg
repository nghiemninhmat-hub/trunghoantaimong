<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="phxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6d1b"/>
      <stop offset="35%" stop-color="#e8c84a"/>
      <stop offset="55%" stop-color="#fff3a0"/>
      <stop offset="75%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#8a6d1b"/>
    </linearGradient>
    <linearGradient id="phxRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1f10"/>
      <stop offset="50%" stop-color="#c8392b"/>
      <stop offset="100%" stop-color="#7a1f10"/>
    </linearGradient>
    <radialGradient id="phxInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#e8c84a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8a6d1b" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="phxBlur"><feGaussianBlur stdDeviation="0.8"/></filter>
  </defs>
  <!-- Inner glow -->
  <circle cx="120" cy="120" r="100" fill="url(#phxInnerGlow)"/>
  <!-- Main gold ring — thick ornate -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#phxGold)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#phxGold)" stroke-width="6" opacity="0.9"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="#8a6d1b" stroke-width="0.8" opacity="0.5"/>
  <!-- Decorative filigree dots around ring -->
  <g fill="#e8c84a" opacity="0.6">
    <circle cx="120" cy="22" r="1.5"/>
    <circle cx="165" cy="34" r="1"/>
    <circle cx="200" cy="65" r="1"/>
    <circle cx="216" cy="120" r="1.5"/>
    <circle cx="200" cy="175" r="1"/>
    <circle cx="165" cy="206" r="1"/>
    <circle cx="120" cy="218" r="1.5"/>
    <circle cx="75" cy="206" r="1"/>
    <circle cx="40" cy="175" r="1"/>
    <circle cx="24" cy="120" r="1.5"/>
    <circle cx="40" cy="65" r="1"/>
    <circle cx="75" cy="34" r="1"/>
  </g>
  <!-- Phoenix at top — detailed -->
  <g transform="translate(120,22)">
    <!-- Body -->
    <path d="M0,12 C-8,8 -16,4 -18,-4 C-14,-2 -10,-4 -8,-8 C-6,-4 -4,-6 -3,-10 C-2,-6 0,-8 0,-14 C0,-8 2,-6 3,-10 C4,-6 6,-4 8,-8 C10,-4 14,-2 18,-4 C16,4 8,8 0,12 Z" fill="url(#phxRed)" stroke="url(#phxGold)" stroke-width="0.4"/>
    <!-- Head crest -->
    <path d="M0,-14 C-2,-18 -1,-22 0,-24 C1,-22 2,-18 0,-14" fill="url(#phxRed)" stroke="url(#phxGold)" stroke-width="0.3"/>
    <!-- Eye -->
    <circle cx="-4" cy="-6" r="1.2" fill="#1a0a05"/>
    <circle cx="4" cy="-6" r="1.2" fill="#1a0a05"/>
    <!-- Beak -->
    <path d="M-2,-10 L-4,-12 L-1,-10" fill="url(#phxGold)"/>
    <path d="M2,-10 L4,-12 L1,-10" fill="url(#phxGold)"/>
    <!-- Tail feathers flowing down both sides -->
    <path d="M-10,10 Q-18,20 -16,30 Q-14,35 -10,32" fill="none" stroke="url(#phxRed)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-6,12 Q-10,22 -8,32" fill="none" stroke="url(#phxGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M10,10 Q18,20 16,30 Q14,35 10,32" fill="none" stroke="url(#phxRed)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6,12 Q10,22 8,32" fill="none" stroke="url(#phxGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Flowing feathers wrapping left arc -->
  <g opacity="0.65">
    <path d="M28,120 C20,100 25,80 40,70" fill="none" stroke="url(#phxRed)" stroke-width="2" stroke-linecap="round"/>
    <path d="M30,110 C24,95 28,82 38,75" fill="none" stroke="url(#phxGold)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M28,140 C20,160 25,180 40,190" fill="none" stroke="url(#phxRed)" stroke-width="2" stroke-linecap="round"/>
    <path d="M30,130 C24,145 28,168 38,175" fill="none" stroke="url(#phxGold)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Flowing feathers wrapping right arc -->
  <g opacity="0.65">
    <path d="M212,120 C220,100 215,80 200,70" fill="none" stroke="url(#phxRed)" stroke-width="2" stroke-linecap="round"/>
    <path d="M210,110 C216,95 212,82 202,75" fill="none" stroke="url(#phxGold)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M212,140 C220,160 215,180 200,190" fill="none" stroke="url(#phxRed)" stroke-width="2" stroke-linecap="round"/>
    <path d="M210,130 C216,145 212,168 202,175" fill="none" stroke="url(#phxGold)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Ruby cluster at bottom -->
  <g transform="translate(120,218)">
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="url(#phxRed)" stroke="url(#phxGold)" stroke-width="0.5"/>
    <ellipse cx="-8" cy="1" rx="3" ry="2.5" fill="#c8392b" opacity="0.85"/>
    <ellipse cx="8" cy="1" rx="3" ry="2.5" fill="#c8392b" opacity="0.85"/>
    <circle cx="0" cy="-1" r="1.5" fill="#ff6b4a" opacity="0.6"/>
  </g>
  <!-- Corner pearl accents -->
  <g fill="#fff3a0" opacity="0.5">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="180" r="2"/>
    <circle cx="180" cy="180" r="2"/>
  </g>
</svg>
