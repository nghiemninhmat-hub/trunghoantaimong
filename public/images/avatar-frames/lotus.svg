<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="lotBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3a20"/>
      <stop offset="30%" stop-color="#8b7333"/>
      <stop offset="50%" stop-color="#b89545"/>
      <stop offset="70%" stop-color="#8b7333"/>
      <stop offset="100%" stop-color="#3a2a15"/>
    </linearGradient>
    <linearGradient id="lotGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#e8c840"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="lotInnerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="92%" stop-color="#8b7333" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4a3a20" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="100" fill="url(#lotInnerGlow)"/>
  <!-- Bronze ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#lotBronze)" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="none" stroke="url(#lotBronze)" stroke-width="6" opacity="0.85"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#lotGold)" stroke-width="0.8" opacity="0.45"/>
  <!-- Lotus at top — detailed layered petals -->
  <g transform="translate(120,22)">
    <!-- Outer petals -->
    <path d="M0,2 C-8,-2 -10,-10 -5,-16 C-3,-14 0,-16 0,-18 C0,-16 3,-14 5,-16 C10,-10 8,-2 0,2" fill="url(#lotBronze)" stroke="url(#lotGold)" stroke-width="0.4"/>
    <!-- Side petals -->
    <path d="M0,0 C-6,-3 -10,-8 -8,-14 C-6,-12 -4,-13 -3,-15" fill="url(#lotBronze)" opacity="0.7" stroke="url(#lotGold)" stroke-width="0.3" transform="rotate(-35)"/>
    <path d="M0,0 C-6,-3 -10,-8 -8,-14 C-6,-12 -4,-13 -3,-15" fill="url(#lotBronze)" opacity="0.7" stroke="url(#lotGold)" stroke-width="0.3" transform="rotate(35)"/>
    <!-- Inner petal -->
    <path d="M0,0 C-4,-4 -5,-10 -3,-13 C-2,-12 0,-13 0,-14 C0,-13 2,-12 3,-13 C5,-10 4,-4 0,0" fill="url(#lotGold)" opacity="0.8"/>
    <!-- Center pistil -->
    <circle cx="0" cy="-7" r="2" fill="#e8c840"/>
    <circle cx="0" cy="-7" r="1" fill="#fff3a0" opacity="0.6"/>
    <!-- Petal vein details -->
    <g fill="none" stroke="url(#lotGold)" stroke-width="0.3" opacity="0.4">
      <path d="M0,-2 L0,-15"/>
      <path d="M-4,-1 L-7,-12"/>
      <path d="M4,-1 L7,-12"/>
    </g>
  </g>
  <!-- Lotus at bottom — mirror -->
  <g transform="translate(120,218) rotate(180)">
    <path d="M0,2 C-8,-2 -10,-10 -5,-16 C-3,-14 0,-16 0,-18 C0,-16 3,-14 5,-16 C10,-10 8,-2 0,2" fill="url(#lotBronze)" stroke="url(#lotGold)" stroke-width="0.4"/>
    <path d="M0,0 C-6,-3 -10,-8 -8,-14 C-6,-12 -4,-13 -3,-15" fill="url(#lotBronze)" opacity="0.7" stroke="url(#lotGold)" stroke-width="0.3" transform="rotate(-35)"/>
    <path d="M0,0 C-6,-3 -10,-8 -8,-14 C-6,-12 -4,-13 -3,-15" fill="url(#lotBronze)" opacity="0.7" stroke="url(#lotGold)" stroke-width="0.3" transform="rotate(35)"/>
    <path d="M0,0 C-4,-4 -5,-10 -3,-13 C-2,-12 0,-13 0,-14 C0,-13 2,-12 3,-13 C5,-10 4,-4 0,0" fill="url(#lotGold)" opacity="0.8"/>
    <circle cx="0" cy="-7" r="2" fill="#e8c840"/>
    <circle cx="0" cy="-7" r="1" fill="#fff3a0" opacity="0.6"/>
  </g>
  <!-- Lapis lazuli stones at sides -->
  <g fill="#1e3a5f" stroke="#0a1a2e" stroke-width="0.4">
    <circle cx="28" cy="120" r="4"/>
    <circle cx="212" cy="120" r="4"/>
  </g>
  <!-- Lapis inner highlight -->
  <g fill="#3a6a9f" opacity="0.5">
    <circle cx="27" cy="119" r="2"/>
    <circle cx="211" cy="119" r="2"/>
  </g>
  <!-- Carnelian stones at corners -->
  <g fill="#b5651d" stroke="#8b4513" stroke-width="0.3">
    <circle cx="55" cy="55" r="3"/>
    <circle cx="185" cy="55" r="3"/>
    <circle cx="55" cy="185" r="3"/>
    <circle cx="185" cy="185" r="3"/>
  </g>
  <!-- Antique patina spots -->
  <g fill="#3a5f3a" opacity="0.25">
    <circle cx="40" cy="80" r="2"/>
    <circle cx="200" cy="80" r="2"/>
    <circle cx="40" cy="160" r="2"/>
    <circle cx="200" cy="160" r="2"/>
    <circle cx="120" cy="35" r="1.5"/>
    <circle cx="120" cy="205" r="1.5"/>
  </g>
  <!-- Gold filigree swirls -->
  <g fill="none" stroke="url(#lotGold)" stroke-width="0.6" opacity="0.4">
    <path d="M45,120 Q50,115 55,120 Q60,125 65,120"/>
    <path d="M175,120 Q180,115 185,120 Q190,125 195,120"/>
  </g>
  <!-- Cloisonne wire details -->
  <g fill="none" stroke="url(#lotGold)" stroke-width="0.3" opacity="0.3">
    <path d="M35,95 Q40,90 45,95"/>
    <path d="M205,95 Q200,90 195,95"/>
    <path d="M35,145 Q40,150 45,145"/>
    <path d="M205,145 Q200,150 195,145"/>
  </g>
</svg>
